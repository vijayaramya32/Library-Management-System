<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <link rel="stylesheet" href="ManageMembersStyle.css" />
</head>
<body>

        <header>
				<div id="intro">
					<h1 ><img id = "headerImg" src="../../images/book1.png" />Library Management System</h1>
					
					<nav>
						<a href="../Home/Home.html">Home</a>
						<a href="../BookManagement/BookManagement.html" class="active">BookManagement</a>
						<a href="../MemberManagement/MemberManagement.html">Member Management</a>
						<a href="../IssueManagement/IssueManagement.html">Issue Management</a>

						
					</nav>

					<div id="profileContainer">
						<div class="profile_icon" id="profileIcon">
							👤
						</div>

						<div class="profile-dropdown" id="profileDropdown">
							<Button id="logoutButton">logout</Button>
						</div>
					</div>
			</div>
			
		</header>

        <main>
        <div id="addManageMember">
            <h2>Add Member</h2> 
            <form id="issueForm">
                
                <input type="hidden" name="memberID">
                
                <input type  = "text" name = "memberName" placeholder="enter member name"/>
                
                
                <input type  = "text" name = "email" placeholder="enter email"/>
                
                <input type  = "text" name = "phone" placeholder="enter phone"/>
                
                <input type  = "text" name = "address" placeholder="enter address"/>
                
                <div id="manageAddButton">
                    <button type="submit" id="addBookButton">Add Member</button>
                </div>
            </form>
        </div>

        <div id="table">
            <h2>All Members</h2>
            <table>
                <thead>
					<tr>
                        <th>memberID</th>
                        <th>memberName</th>
                        <th>email</th>
                        <th>phone</th>
                        <th>address</th>
                        <th>membershipDate</th>
                        <th>status</th>
                        <th>Actions</th>
                    </tr>

				</thead>

				<tbody id = "memberBody">

				</tbody>
            </table>
        </div>
        </main>
        <script src="ManageMembersScript.js"></script>
		
    
</body>
</html>
