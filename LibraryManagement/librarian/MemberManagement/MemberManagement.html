<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel = "stylesheet" href = "MemberManagement.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

    <header id = "intro">

        <h1><img id = "headerImg" src = "../../images/book1.png">Library Management System</h1>

        <nav>
            <a href = "../Home/Home.html">Home</a>
            <a href = "../BookManagement/BookManagement.html">Book Management</a>
            <a href = "../MemberManagement/MemberManagement.html" class="active">Member Management</a>
            <a href = "../IssueManagement/IssueManagement.html">Issue Management</a>
        </nav>

         <div id="profileContainer">
				<div class="profile-icon" id="profileIcon">
					👤
				</div>

				<div class="profile-dropdown" id="profileDropdown">
					<Button id="logoutButton">logout</Button>
				</div>
		</div>

    </header>

    <main>
        <div id = "addMember">
                <button onclick = "location.href='ManageMembers.html'">Manage Members</button>
        </div>

        <div id = "searchMember">
            <form method = "get">
                <select id = "searchBy">
                    <option value = "">select value</option>
                    <option value="memberID">Member ID</option>
                    <option value="memberName">Name</option>
                    <option value="email">Email</option>
                    <option value = "phone">phone</option>
                    <option value = "All">ALL</option>
                </select>
           
                <label for = "value">Enter value:</label>
                <input type = "text" name = "searchValue" id ="value"/>
                <button id ="searchButton" type="button">search</button>
            </form>
            
        </div>

        <div id = "membersTable">
            <table>
                <thead>
                    <tr>
                        <th>memberID</th>
                        <th>memberName</th>
                        <th>email</th>
                        <th>phone</th>
                        <th>address</th>
                        <th>membershipDate</th>
                        <th>status</th>
                    </tr>
                </thead>
                <tbody id="memberBody">

                </tbody>
            </table>
        </div>
    </main>
    <footer>
		<p>Developed by Vijaya Ramya Maddipudi</p>
	</footer>
    <script src="MemberManagementScript.js"></script>


    
</body>
</html>
