<!DOCTYPE html>
	<html>
		<head>
			<meta charset = "utf-8">
			<title>BookManagement</title>
			<link rel = "stylesheet" href = "BookManagementstyle.css">
			<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
		</head>
		<body>
			<header>
				<div id="intro">
					<h1 ><img id = "headerImg" src="../../images/book1.png" />Library Management System</h1>
					
					<nav>
						<a href="../Home/Home.html">Home</a>
						<a href="../BookManagement/BookManagement.html" class="active">BookManagement</a>
						<a href="../MemberManagement/MemberManagement.html">Member Management</a>
						<a href="../IssueManagement/IssueManagement.html">Issue Management</a>

						
					</nav>

					<div id="profileContainer">
						<div class="profile_icon" id="profileIcon">
							👤
						</div>

						<div class="profile-dropdown" id="profileDropdown">
							<Button id="logoutButton">logout</Button>
						</div>
					</div>
			</div>
			
		</header>

		<main>
			<div id = "addBook">
				<button onclick="location.href='ManageBooks.html'">MANAGE BOOKS</button>
			</div>

			<div id = "searchBook">
				<form  method="get">
					<select id="searchBy">
						<option value="isbn">ISBN</option>
						<option value="title">title</option>
						<option value="author">author</option>
						<option value = "category">category</option>
						<option value="All">ALL</option>
					</select>
		
					<label for="value">Enter Value:</label>
	    			<input id = "value" type="text" name="searchValue">
	    			<Button id = "searchButton" type="button">search</Button>
	   			</form>
			</div>
			
			<div  id = "booksTable">
				<table>
					<thead>
						<tr>
							<th>ID</th>
	            			<th>ISBN</th>
							<th>Title</th>
							<th>Author</th>
							<th>Category</th>
							<th>price</th>
							<th>Quantity</th>
							<th>status</th>
	         			</tr>
					</thead>

					<tbody id = "bookBody">

					</tbody>
				</table>
			</div>
		</main>
		<footer>
			<p>Developed by Vijaya Ramya Maddipudi</p>
		</footer>

		<script src="BookManagementScript.js"></script>

	</html>
