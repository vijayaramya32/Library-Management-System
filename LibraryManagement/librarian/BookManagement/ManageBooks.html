<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <link rel="stylesheet" href="ManageBooksStyle.css" />
</head>
<body>

        <header>
				<div id="intro">
					<h1 ><img id = "headerImg" src="../../images/book1.png" />Library Management System</h1>
					
					<nav>
						<a href="../Home/Home.html">Home</a>
						<a href="../BookManagement/BookManagement.html" class="active">BookManagement</a>
						<a href="../MemberManagement/MemberManagement.html">Member Management</a>
						<a href="../IssueManagement/IssueManagement.html">Issue Management</a>

						
					</nav>

					<div id="profileContainer">
						<div class="profile_icon" id="profileIcon">
							👤
						</div>

						<div class="profile-dropdown" id="profileDropdown">
							<Button id="logoutButton">logout</Button>
						</div>
					</div>
			</div>
			
		</header>

        <main>
        <div id="addManageBook">
            <h2>Add Book</h2> 
            <form id="issueForm"> 

                <input type="hidden" name="bookID">
                <input type="text" name="isbn" required placeholder="Enter ISBN">  
                
                <input type="text" name="bookTitle" required placeholder="Enter Book Title"> 
                
                <input type="text" name="author" required placeholder="enter author"> 
                
                <input type="text" name="category" required placeholder="enter category">  
                
                <input type="number" name="price" step="0.01" required placeholder="enter price"> 
                
                <input type="number" name="availableQuantity" required placeholder="available quantity">  
                
                <input type="number" name="publishedYear" required placeholder="enter published year">  
                <div id="manageAddButton">
                    <button type="submit" id="addBookButton">Add Book</button>
                </div>
            </form>
        </div>

        <div id="table">
            <h2>All Books</h2>
            <table>
                <thead>
						 <tr>
							<th>ID</th>
							<th>ISBN</th>
							<th>Title</th>
							<th>Author</th>
							<th>Category</th>
                            <th>price</th>
							<th>Quantity</th>
							<th>status</th>
                            <th>Actions</th>
        				</tr>

				</thead>

				<tbody id = "bookBody">

				</tbody>
            </table>
        </div>
        </main>
        <script src="ManageBooksScript.js"></script>
		
    
</body>
</html>
