<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Management</title>
    <link rel="stylesheet" href="IssueManagementStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

</head>
<body>
    <header id = "intro">
			<h1 ><img id = "headerImg" src="../../images/book1.png" />Library Management System</h1>
			
			<nav>
				<a href="../Home/Home.html">Home</a>
				<a href="../BookManagement/BookManagement.html">BookManagement</a>
				<a href="../MemberManagement/MemberManagement.html">Member Management</a>
				<a href="IssueManagement.html" class="active"">Issue Management</a>
			</nav>

            <div id="profileContainer">
				<div class="profile-icon" id="profileIcon">
					👤
				</div>

				<div class="profile-dropdown" id="profileDropdown">
					<Button id="logoutButton">logout</Button>
				</div>
			</div>
    </header>
    <main>
        <section>
            <div id = "Issuereturn">
                <button class="issueReturn" onclick="location.href='IssueBook.html'">Issue</button>
                <button class="issueReturn" onclick="location.href='ReturnBook.html'">Return</button>
            </div>

            <div id="searchIssue">
                    <form method = "get">

                        <select id="searchBy">
                            <option value="memberID">member ID</option>
                            <option value = "returnDate">Return Date</option>
                            <option value = "all">ALL</option>

                        </select>
                        <label for="inputValue">Input:</label>
                        <input type = "text" id = "inputValue" name = "inputValue"/>
                        <button id="searchButton" type="button">search</button>

                    </form>
            </div>
            <div id = "IssueTables">
                <table>
                    <thead>
                        <tr>
                            <th>IssueID</th>
                            <th>Member Name</th>
                            <th>Book Name</th>
                            <th>IssueDate</th>
                            <th>Due Date</th>
                            <th>Return date</th>
                            <th>status</th>
                        </tr>
                        
                    </thead>
                    <tbody id="issueBookBody">
                            
                    </tbody>

                </table>
            </div>
        </section>
    </main>
    <footer>
		<p>Developed by Vijaya Ramya Maddipudi</p>
	</footer>
    <script src = "IssueManagementScript.js"></script>
    
</body>
</html>
